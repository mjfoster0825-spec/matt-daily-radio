name: Publish Matt Daily Radio

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: matt-daily-radio
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Kokoro audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile==0.13.1 numpy
      - name: Get verified Matt Daily narration builder
        run: |
          mkdir -p scripts
          curl --fail --location --retry 3 --silent --show-error \
            https://the-matt-daily-journal.vercel.app/radio/build_radio.py \
            -o scripts/build_radio.py
          echo 'c7b4683bbee4eacfa41c9aefab1d2b12557ad1d001cc9d251013398da16975a3  scripts/build_radio.py' | sha256sum --check
          python -m py_compile scripts/build_radio.py
      - name: Create Kokoro Essential Briefing
        run: python scripts/build_radio.py --minutes 12 --voice am_michael
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload podcast and MP3 files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish podcast on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
